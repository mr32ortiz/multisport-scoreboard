<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multisport Scorebug</title>
<style>
:root{--gold:#f4c928;--blue:#075b91;--navy:#182b5a;--ink:#101820;--white:#fff;--panel:#f4f4f1;--muted:#4c5158}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
/* Compact, broadcast-style scorebug. Transparent canvas outside the graphic. */
.scorebug{position:absolute;left:2.5%;top:3%;width:min(610px,95vw);height:166px;display:grid;grid-template-columns:1fr .98fr 1fr;align-items:stretch;filter:drop-shadow(0 3px 2px #0005);}
.team{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;color:#fff;border:3px solid #f8f8f5;}
.teamA{background:linear-gradient(135deg,#0878ad,var(--blue));border-radius:17px 0 0 17px;border-right:0}.teamB{background:linear-gradient(135deg,#203d78,var(--navy));border-radius:0 17px 17px 0;border-left:0}
.team:after{content:"";position:absolute;inset:0;opacity:.10;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 24px,#fff 25px 30px,transparent 31px 56px)}
.name{position:relative;z-index:1;font-size:clamp(16px,3.1vw,27px);line-height:1;font-weight:900;letter-spacing:.04em;text-transform:uppercase;max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 2px #0004}
.num{position:relative;z-index:1;margin-top:5px;font-size:clamp(40px,7vw,64px);line-height:.95;font-weight:900;letter-spacing:-.04em;text-shadow:0 2px 2px #0004;font-variant-numeric:tabular-nums}
.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:18px 5px 32px;background:linear-gradient(#fff,#e6e7e7);border-top:3px solid #f8f8f5;border-bottom:3px solid #f8f8f5;text-align:center;min-width:0}
.inning{font-weight:900;font-size:clamp(16px,2.8vw,25px);line-height:1.1;white-space:nowrap;color:#111}
.half-arrow{display:inline-block;font-size:.83em;margin-right:3px;color:#111}
.outs{font-size:clamp(13px,2.1vw,19px);font-weight:900;margin-top:8px;white-space:nowrap;letter-spacing:.02em}
.count{font-size:11px;font-weight:800;color:#3e4349;margin-top:4px;white-space:nowrap}
.diamond{position:absolute;z-index:5;left:50%;bottom:-31px;transform:translateX(-50%);width:168px;height:74px;pointer-events:none}
.base{position:absolute;width:44px;height:44px;background:linear-gradient(145deg,#d7d9dc,#f6f6f4);border:3px solid #fff;box-shadow:0 3px 0 #777,0 4px 3px #0004;transform:rotate(45deg);border-radius:2px}
.base.on{background:linear-gradient(145deg,#fff044,#f3bb00);border-color:#fff;box-shadow:0 3px 0 #777,0 4px 3px #0004}
#b2{left:62px;top:-2px}#b3{left:15px;top:31px}#b1{right:15px;top:31px}
#pickleDetails{display:none;font-size:clamp(13px,2.2vw,19px);font-weight:900;line-height:1.25;margin-top:9px}.serve-dot{display:inline-block;width:9px;height:9px;background:var(--gold);border-radius:50%;margin-right:5px;vertical-align:middle}.sub{font-size:10px;color:#444;letter-spacing:.07em;margin-top:4px}
@media(max-width:480px){.scorebug{left:2%;top:2%;height:125px;width:96vw}.team{border-width:2px}.teamA{border-radius:12px 0 0 12px}.teamB{border-radius:0 12px 12px 0}.center{border-width:2px;padding-top:14px;padding-bottom:26px}.diamond{transform:translateX(-50%) scale(.77);transform-origin:top center;bottom:-30px}.outs{margin-top:5px}.count{font-size:9px}.name{letter-spacing:.02em}}
</style></head><body>
<div class="scorebug" aria-label="Live game scoreboard">
 <div class="team teamA"><div class="name" id="teamA">HOME</div><div class="num" id="scoreA">0</div></div>
 <div class="center">
  <div class="inning" id="inningText"><span class="half-arrow">▲</span>1ST</div>
  <div class="outs" id="outsText">0 OUTS</div>
  <div class="count" id="countText">0 BALLS · 0 STRIKES</div>
  <div id="pickleDetails"><span class="serve-dot"></span><span id="serverText">SERVING: HOME</span><div class="sub" id="serverNumText">SERVER 1 · GAME 1</div></div>
  <div class="diamond" id="diamond"><span class="base" id="b1"></span><span class="base" id="b2"></span><span class="base" id="b3"></span></div>
 </div>
 <div class="team teamB"><div class="name" id="teamB">AWAY</div><div class="num" id="scoreB">0</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const q=new URLSearchParams(location.search),url=q.get('url')||'https://eyimquzlarsspzqqsvdw.supabase.co',key=q.get('key')||'sb_publishable_oOLV4NWS5lafVsshmn7Dwg_OrccbEQr',room=q.get('room')||'matchday';
function ordinal(n){n=Number(n)||1;return n+(n%100>=11&&n%100<=13?'TH':({1:'ST',2:'ND',3:'RD'}[n%10]||'TH'))}
function render(s){
 for(const k of ['teamA','scoreA','teamB','scoreB'])if(s[k]!==undefined)document.getElementById(k).textContent=s[k];
 const sport=(s.sport||'SOFTBALL').toUpperCase(),soft=['SOFTBALL','BASEBALL'].includes(sport),half=(s.half||'TOP').toUpperCase();
 document.getElementById('diamond').style.display=soft?'block':'none';
 document.getElementById('inningText').style.display=soft?'block':'none';
 document.getElementById('outsText').style.display=soft?'block':'none';
 document.getElementById('countText').style.display=soft?'block':'none';
 document.getElementById('pickleDetails').style.display=sport==='PICKLEBALL'?'block':'none';
 document.getElementById('inningText').innerHTML='<span class="half-arrow">'+(half==='BOTTOM'?'▼':'▲')+'</span>'+ordinal(s.inning||1);
 document.getElementById('outsText').textContent=(Number(s.outs)||0)+' OUT'+((Number(s.outs)||0)===1?'':'S');
 document.getElementById('countText').textContent=(Number(s.balls)||0)+' BALLS · '+(Number(s.strikes)||0)+' STRIKES';
 ['base1','base2','base3'].forEach((k,i)=>document.getElementById(['b1','b2','b3'][i]).classList.toggle('on',!!s[k]));
 document.getElementById('serverText').textContent='SERVING: '+((s.server||'A')==='A'?(s.teamA||'HOME'):(s.teamB||'AWAY'));
 document.getElementById('serverNumText').textContent='SERVER '+(s.serverNumber||1)+' · GAME '+(s.game||1);
}
render({sport:'SOFTBALL',teamA:'HOME',scoreA:0,teamB:'AWAY',scoreB:0,half:'TOP',inning:1,outs:0,balls:0,strikes:0,base1:false,base2:false,base3:false});
if(url&&key&&window.supabase){const c=supabase.createClient(url,key),ch=c.channel('score-room-'+room,{config:{broadcast:{self:true}}});ch.on('broadcast',{event:'state'},({payload})=>{if(payload?.state)render(payload.state)});ch.subscribe(()=>ch.send({type:'broadcast',event:'request',payload:{}}));}
</script></body></html>
