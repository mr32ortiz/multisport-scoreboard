<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Sport Overlay</title><style>
:root{--gold:#d4ad43;--navy:#101820;--panel:rgba(16,24,32,.96);--line:rgba(255,255,255,.18);--white:#f7f9fb;--muted:#bdc7cf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif;color:var(--white)}
.scorebug{position:absolute;left:2.5%;top:3%;display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden;box-shadow:0 2px 8px #0002;max-width:94vw}
.sport{display:flex;align-items:center;justify-content:center;padding:0 12px;background:var(--gold);color:#101820;font-weight:900;font-size:11px;letter-spacing:.07em;white-space:nowrap}
.team{display:flex;align-items:center;gap:12px;min-width:112px;padding:8px 12px}.team+.team{border-left:1px solid var(--line)}
.name{font-size:12px;font-weight:800;letter-spacing:.04em;white-space:nowrap;max-width:145px;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}.num{font-size:24px;line-height:1;font-weight:900;min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
.details{position:absolute;left:2.5%;top:calc(3% + 47px);display:none;align-items:center;gap:12px;padding:5px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:11px;font-weight:800;box-shadow:0 2px 8px #0002;white-space:nowrap}
.detail{display:flex;align-items:center;gap:5px}.divider{height:22px;width:1px;background:var(--line)}.muted{color:var(--muted);font-size:9px;letter-spacing:.06em}
.diamond{width:38px;height:31px;position:relative;display:inline-block}.base{width:9px;height:9px;background:#53616b;border:1px solid #e8edf0;position:absolute;transform:rotate(45deg);border-radius:1px}.base.on{background:var(--gold);border-color:var(--gold)}#b1{right:4px;bottom:4px}#b2{left:14px;top:2px}#b3{left:4px;bottom:4px}
#pickleDetails{gap:9px}.serve-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block}
@media(max-width:600px){.scorebug{left:2%;top:2%;max-width:96vw}.sport{padding:0 7px;font-size:9px}.team{min-width:0;gap:6px;padding:7px 8px}.name{font-size:10px;max-width:75px}.num{font-size:20px}.details{left:2%;top:calc(2% + 39px);gap:8px;padding:4px 7px;font-size:10px}.muted{font-size:8px}.diamond{transform:scale(.85);margin:-2px}}
</style></head><body>
<div class="scorebug"><div class="sport" id="sport">SOFTBALL</div><div class="team"><span class="name" id="teamA">HOME</span><span class="num" id="scoreA">0</span></div><div class="team"><span class="name" id="teamB">AWAY</span><span class="num" id="scoreB">0</span></div></div>
<div class="details" id="softDetails"><div class="detail"><div><div id="inningText">TOP 1</div><div class="muted">INNING</div></div></div><div class="divider"></div><div class="detail"><div><div id="outsText">0 OUT</div><div class="muted">OUTS</div></div></div><div class="divider"></div><div class="detail"><div class="diamond"><span class="base" id="b1"></span><span class="base" id="b2"></span><span class="base" id="b3"></span></div><div class="muted">BASES</div></div><div class="divider"></div><div class="detail"><div><div id="countText">0-0</div><div class="muted">BALLS–STRIKES</div></div></div></div>
<div class="details" id="pickleDetails"><div class="detail"><span class="serve-dot"></span><div><div id="serverText">SERVING: TEAM A</div><div class="muted" id="serverNumText">SERVER 1 · GAME 1</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const q=new URLSearchParams(location.search),url=q.get('url'),key=q.get('key'),room=q.get('room')||'matchday';
function render(s){const map={channel:'channel',teamA:'teamA',scoreA:'scoreA',teamB:'teamB',scoreB:'scoreB',instagram:'ig',youtube:'yt',twitch:'tw',event:'event'};for(const [k,id] of Object.entries(map))if(s[k]!==undefined)document.getElementById(id).textContent=s[k];if(s.channel)document.getElementById('mark').textContent=s.channel.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();if(s.color)document.documentElement.style.setProperty('--a',s.color);const sport=(s.sport||'SOFTBALL').toUpperCase();document.getElementById('sport').textContent=sport;const isSoft=['SOFTBALL','BASEBALL'].includes(sport);document.getElementById('softDetails').style.display=isSoft?'flex':'none';document.getElementById('pickleDetails').style.display=sport==='PICKLEBALL'?'flex':'none';document.getElementById('inningText').textContent=(s.half||'TOP')+' '+(s.inning||1);document.getElementById('outsText').textContent=(s.outs||0)+' OUT';document.getElementById('countText').textContent=(s.balls||0)+'-'+(s.strikes||0);['base1','base2','base3'].forEach((k,i)=>document.getElementById(['b1','b2','b3'][i]).classList.toggle('on',!!s[k]));document.getElementById('serverText').textContent='SERVING: '+((s.server||'A')==='A'?(s.teamA||'TEAM A'):(s.teamB||'TEAM B'));document.getElementById('formatText').textContent=s.format||'PICKLEBALL';document.getElementById('serverNumText').textContent='SERVER '+(s.serverNumber||1)+' · GAME '+(s.game||1)}
if(url&&key&&window.supabase){const c=supabase.createClient(url,key),ch=c.channel('score-room-'+room,{config:{broadcast:{self:true}}});ch.on('broadcast',{event:'state'},({payload})=>payload?.state&&render(payload.state));ch.subscribe(()=>ch.send({type:'broadcast',event:'request',payload:{}}));}
</script></body></html>
